<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Fall Detection - Phone GPS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    .subtitle { color: #666; margin-bottom: 25px; }
    .status {
      padding: 13px;
      border-radius: 10px;
      background: #eee;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .location {
      text-align: left;
      background: #f7f7f7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .row { margin: 12px 0; }
    .label { font-size: 13px; color: #666; }
    .value {
      font-size: 18px;
      font-weight: 600;
      word-break: break-all;
      margin-top: 3px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #222;
      color: #fff;
    }
    button:disabled { opacity: .55; }
    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SMART FALL DETECTION</h1>
    <div class="subtitle">Phone GPS Backup</div>

    <div class="status" id="status">Ready to get phone location</div>

    <div class="location">
      <div class="row">
        <div class="label">Latitude</div>
        <div class="value" id="latitude">--</div>
      </div>

      <div class="row">
        <div class="label">Longitude</div>
        <div class="value" id="longitude">--</div>
      </div>

      <div class="row">
        <div class="label">Accuracy</div>
        <div class="value" id="accuracy">--</div>
      </div>
    </div>

    <button id="gpsButton" onclick="getLocation()">
      GET PHONE LOCATION
    </button>

    <div class="note">
      This page must be opened through HTTPS for browser GPS permission to work.
    </div>
  </div>

<script>
function getLocation() {
  const status = document.getElementById("status");
  const button = document.getElementById("gpsButton");

  if (!window.isSecureContext) {
    status.textContent = "ERROR: Open this page using HTTPS.";
    return;
  }

  if (!navigator.geolocation) {
    status.textContent = "GPS is not supported by this browser.";
    return;
  }

  status.textContent = "Requesting phone GPS...";
  button.disabled = true;

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      document.getElementById("latitude").textContent = lat.toFixed(7);
      document.getElementById("longitude").textContent = lon.toFixed(7);
      document.getElementById("accuracy").textContent =
        Math.round(accuracy) + " metres";

      status.textContent = "PHONE GPS LOCATION RECEIVED";
      button.disabled = false;

      // Keep these values available for the next ESP8266 integration step.
      window.phoneLatitude = lat;
      window.phoneLongitude = lon;
    },
    function(error) {
      let message = "Unable to get location.";

      if (error.code === 1) {
        message = "Location permission denied.";
      } else if (error.code === 2) {
        message = "Phone location is unavailable.";
      } else if (error.code === 3) {
        message = "GPS request timed out.";
      }

      status.textContent = message;
      button.disabled = false;
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}
</script>
</body>
</html>
