<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Fall Detection - Phone GPS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .status {
      padding: 13px;
      border-radius: 10px;
      background: #eee;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .location {
      text-align: left;
      background: #f7f7f7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .row {
      margin: 12px 0;
    }

    .label {
      font-size: 13px;
      color: #666;
    }

    .value {
      font-size: 18px;
      font-weight: 600;
      word-break: break-all;
      margin-top: 3px;
    }

    .input-section {
      text-align: left;
      margin-bottom: 18px;
    }

    .input-section label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 7px;
    }

    .input-section input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #222;
      color: #fff;
      margin-top: 8px;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }

    .blynk-status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #f7f7f7;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      white-space: pre-line;
    }
  </style>

</head>

<body>

  <div class="card">

```
<h1>SMART FALL DETECTION</h1>

<div class="subtitle">
  Phone GPS Backup
</div>

<div class="status" id="status">
  Ready to get phone location
</div>

<div class="location">

  <div class="row">
    <div class="label">Latitude</div>
    <div class="value" id="latitude">--</div>
  </div>

  <div class="row">
    <div class="label">Longitude</div>
    <div class="value" id="longitude">--</div>
  </div>

  <div class="row">
    <div class="label">Accuracy</div>
    <div class="value" id="accuracy">--</div>
  </div>

</div>

<div class="input-section">

  <label for="blynkToken">
    Blynk Auth Token
  </label>

  <input
    type="password"
    id="blynkToken"
    placeholder="Enter your existing Blynk Auth Token"
    autocomplete="off"
  >

</div>

<button
  id="gpsButton"
  onclick="getLocation()"
>
  GET PHONE LOCATION
</button>

<div
  class="blynk-status"
  id="blynkStatus"
>
  Blynk location: Not sent
</div>

<div class="note">

  Latitude → Blynk V7<br>
  Longitude → Blynk V8

  <br><br>

  Location is obtained directly from the phone GPS.

</div>
```

  </div>

<script>

/* ==================================================
   BLYNK
   ================================================== */

const BLYNK_UPDATE =
  "https://blynk.cloud/external/api/update";

const BLYNK_GET =
  "https://blynk.cloud/external/api/get";


/* ==================================================
   LOAD TOKEN
   ================================================== */

window.addEventListener("load", function() {

  const savedToken =
    localStorage.getItem("smartFallBlynkToken");

  if (savedToken) {

    document.getElementById(
      "blynkToken"
    ).value = savedToken;

  }

});


/* ==================================================
   SAVE TOKEN
   ================================================== */

function getToken() {

  const token =
    document.getElementById(
      "blynkToken"
    ).value.trim();

  if (token) {

    localStorage.setItem(
      "smartFallBlynkToken",
      token
    );

  }

  return token;
}


/* ==================================================
   UPDATE BLYNK VIRTUAL PIN
   ================================================== */

async function updateBlynkPin(
  pin,
  value
) {

  const token = getToken();

  if (!token) {

    throw new Error(
      "Blynk Auth Token is missing."
    );

  }


  const url =
    BLYNK_UPDATE +
    "?token=" +
    encodeURIComponent(token) +
    "&" +
    pin +
    "=" +
    encodeURIComponent(value);


  console.log(
    "--------------------------------"
  );

  console.log(
    "BLYNK UPDATE"
  );

  console.log(
    "Pin:",
    pin
  );

  console.log(
    "Value:",
    value
  );

  console.log(
    "URL:",
    url
  );


  const response =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  const responseText =
    await response.text();


  console.log(
    "HTTP:",
    response.status
  );

  console.log(
    "Response:",
    responseText
  );


  if (!response.ok) {

    throw new Error(
      pin +
      " update failed. HTTP " +
      response.status +
      " " +
      responseText
    );

  }


  return true;
}


/* ==================================================
   READ BLYNK VIRTUAL PIN
   ================================================== */

async function readBlynkPin(pin) {

  const token = getToken();

  const url =
    BLYNK_GET +
    "?token=" +
    encodeURIComponent(token) +
    "&" +
    pin;


  const response =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "Unable to read " +
      pin
    );

  }


  return await response.text();
}


/* ==================================================
   SEND LOCATION
   ================================================== */

async function sendLocationToBlynk(
  latitude,
  longitude
) {

  const blynkStatus =
    document.getElementById(
      "blynkStatus"
    );


  try {

    /* ---------------------------------------------
       LATITUDE
       --------------------------------------------- */

    blynkStatus.textContent =
      "Sending latitude to V7...";


    const latValue =
      Number(latitude).toFixed(7);


    await updateBlynkPin(
      "V7",
      latValue
    );


    /* ---------------------------------------------
       LONGITUDE
       --------------------------------------------- */

    blynkStatus.textContent =
      "Latitude sent ✓\n" +
      "Sending longitude to V8...";


    const lonValue =
      Number(longitude).toFixed(7);


    console.log(
      "FINAL LONGITUDE BEING SENT:",
      lonValue
    );


    await updateBlynkPin(
      "V8",
      lonValue
    );


    /* ---------------------------------------------
       VERIFY V7
       --------------------------------------------- */

    const verifyLat =
      await readBlynkPin("V7");


    /* ---------------------------------------------
       VERIFY V8
       --------------------------------------------- */

    const verifyLon =
      await readBlynkPin("V8");


    console.log(
      "BLYNK V7 AFTER UPDATE:",
      verifyLat
    );

    console.log(
      "BLYNK V8 AFTER UPDATE:",
      verifyLon
    );


    blynkStatus.textContent =
      "BLYNK UPDATED ✓\n\n" +
      "V7: " +
      verifyLat +
      "\n" +
      "V8: " +
      verifyLon;


    return true;

  }

  catch (error) {

    console.error(
      "BLYNK ERROR:",
      error
    );


    blynkStatus.textContent =
      "BLYNK UPDATE FAILED\n\n" +
      error.message;


    return false;

  }

}


/* ==================================================
   GET PHONE GPS
   ================================================== */

function getLocation() {

  const status =
    document.getElementById(
      "status"
    );

  const button =
    document.getElementById(
      "gpsButton"
    );


  if (!window.isSecureContext) {

    status.textContent =
      "ERROR: Open this page using HTTPS.";

    return;

  }


  if (!navigator.geolocation) {

    status.textContent =
      "GPS is not supported.";

    return;

  }


  const token =
    document.getElementById(
      "blynkToken"
    ).value.trim();


  if (!token) {

    status.textContent =
      "Enter your Blynk Auth Token first.";

    return;

  }


  status.textContent =
    "Requesting phone GPS...";


  button.disabled = true;


  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      /* -------------------------------------------
         DISPLAY PHONE GPS
         ------------------------------------------- */

      document.getElementById(
        "latitude"
      ).textContent =
        lat.toFixed(7);


      document.getElementById(
        "longitude"
      ).textContent =
        lon.toFixed(7);


      document.getElementById(
        "accuracy"
      ).textContent =
        Math.round(accuracy) +
        " metres";


      status.textContent =
        "PHONE GPS LOCATION RECEIVED";


      console.log(
        "================================"
      );

      console.log(
        "PHONE GPS"
      );

      console.log(
        "Latitude:",
        lat
      );

      console.log(
        "Longitude:",
        lon
      );

      console.log(
        "================================"
      );


      /* -------------------------------------------
         SEND TO BLYNK
         ------------------------------------------- */

      const success =
        await sendLocationToBlynk(
          lat,
          lon
        );


      if (success) {

        status.textContent =
          "PHONE GPS → BLYNK UPDATED ✓";

      }

      else {

        status.textContent =
          "PHONE GPS RECEIVED\n" +
          "BUT BLYNK UPDATE FAILED";

      }


      button.disabled = false;

    },


    function(error) {

      let message =
        "Unable to get location.";


      if (error.code === 1) {

        message =
          "Location permission denied.";

      }

      else if (error.code === 2) {

        message =
          "Phone location unavailable.";

      }

      else if (error.code === 3) {

        message =
          "GPS request timed out.";

      }


      status.textContent =
        message;


      button.disabled = false;

    },


    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }

  );

}

</script>

</body>
</html>
